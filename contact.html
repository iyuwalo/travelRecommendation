<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Travel Recommendations</title>
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <div class="nav-container">
            <!-- Logo -->
            <a href="#" class="logo">
                🌍 TravelBloom
            </a>
            
            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact Us</a>
            </div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Enter a destination or keyword">
                <button 
                    onclick="performSearch()"
                    class="search-btn">
                    🔍 Search
                </button>
                <button 
                    onclick="resetSearch()"
                    class="clear-btn">
                    Clear
                </button>
            </div>
        </div>
    </nav>

    <!-- Search Results Section -->
    <section class="results-section" id="resultsSection" style="display: none; padding: 60px 5%; background-color: #f8fafc;">
        <div class="container">
            <h2 id="resultsTitle">Travel Recommendations</h2>
            <div class="results-grid" id="resultsGrid">
                <!-- Results will be dynamically inserted here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Contact Hero Section -->
    <section class="hero contact-hero">
        <div class="social-icons">
            <a href="#" class="social-icon">🐦</a>
            <a href="#" class="social-icon">📘</a>
            <a href="#" class="social-icon">📷</a>
            <a href="#" class="social-icon">📺</a>
        </div>
        
        <div class="hero-content">
            <h1>CONTACT US</h1>
            <p>Get in touch</p>
        </div>

        <!-- Contact Form -->
        <div class="contact-form-container">
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <textarea id="message" placeholder="Message" rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </section>

    <script src="travel_recommendation.js"></script>
</body>
</html>
